<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <section>
        <h1>Cadastro de Preferências</h1>

        <form>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu Nome" required><br><br>

            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="Digite seu Email" required><br><br>



            <label for="País">Selecione seu País:</label>
            <select name="pais" id="pais">
                <option value="brasil">Brasil</option>
                <option value="espanha">Espanha</option>
                <option value="portugal">Portugal</option>
                <option value="outros">Outros</option>
            </select><br><br>

            <p>Gênero</p>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="feminino" name="genero" value="feminino">
            <label for="">Feminino</label><br>

            <input type="radio" id="outros" name="genero" value="outros">
            <label for="">Outros</label><br>

            <button type="submit">Cadastrar</button>

        </form>

    </section>

</body>
</html>
